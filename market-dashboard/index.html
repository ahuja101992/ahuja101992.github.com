<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Market"/>
  <meta name="theme-color" content="#F7F8FA"/>
  <title>Market Dashboard — Akshit Ahuja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="manifest.json"/>
  <!-- Analytics: uncomment and replace domain when ready -->
  <!-- <script defer data-domain="akshit.ahuja.js.org" src="https://plausible.io/js/script.js"></script> -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F7F8FA;
      --bg-card:#FFFFFF;
      --bg-alt:#F0F2F7;
      --border:#E2E6EF;
      --border-mid:#C8D0E0;
      --text:#1C2333;
      --text-mid:#4A5568;
      --text-muted:#8896AA;
      --blue:#3D5A99;
      --blue-light:#EBF0FA;
      --amber:#C87533;
      --amber-light:#FDF3E9;
      --amber-border:#EDCFA8;
      --green:#2E7D52;
      --green-light:#E8F5EE;
      --green-border:#B8DCCA;
      --red:#C0392B;
      --red-light:#FDECEA;
      --red-border:#F0B8B3;
      --sans:'Inter',system-ui,sans-serif;
      --serif:'Playfair Display',Georgia,serif;
      --mono:'JetBrains Mono',monospace;
      --shadow-sm:0 1px 3px rgba(28,35,51,0.06);
      --shadow:0 4px 16px rgba(28,35,51,0.09);
      --radius:10px;
      --radius-sm:6px;
    }
    html{background:var(--bg)}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
      padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}

    /* ── SITE NAV — amber top rule = site signature ── */
    .site-nav{
      border-top:3px solid var(--amber);
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
      height:54px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 48px;
      font-family:var(--sans);
    }
    .site-nav-brand{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;}
    .site-nav-links{display:flex;gap:28px;list-style:none;}
    .site-nav-links a{font-size:13px;font-weight:500;color:var(--text-mid);text-decoration:none;transition:color 0.15s;}
    .site-nav-links a:hover{color:var(--blue);}
    .site-nav-links a.active{color:var(--amber);font-weight:600;}

    /* ── DASHBOARD HEADER — sticky below site nav ── */
    .dash-header{
      position:sticky;top:57px;z-index:90;
      background:rgba(247,248,250,0.97);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
      padding:12px 48px 0;
      padding-top:max(12px,calc(env(safe-area-inset-top)));
    }
    .dash-header-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
    .dash-title{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:3px;}
    .dash-meta{font-size:12px;color:var(--text-muted);font-family:var(--mono);}
    .vix-block{text-align:right;}
    .vix-label{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;}
    .vix-val{font-family:var(--mono);font-size:26px;font-weight:700;}

    /* ── TABS ── */
    .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{padding:8px 14px;border:none;background:transparent;color:var(--text-muted);
      font-family:var(--mono);font-size:11px;font-weight:500;cursor:pointer;
      border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.15s;border-radius:6px 6px 0 0;}
    .tab:hover{color:var(--text-mid);}
    .tab.active{color:var(--amber);border-bottom-color:var(--amber);background:var(--amber-light);font-weight:600;}

    /* ── PILLS ── */
    .pill{font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:4px;display:inline-block;}
    .pill-warn{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-border);}
    .pill-success{background:var(--green-light);color:var(--green);border:1px solid var(--green-border);}
    .pill-danger{background:var(--red-light);color:var(--red);border:1px solid var(--red-border);}
    .pill-info{background:var(--blue-light);color:var(--blue);border:1px solid #D3DCF0;}
    .pill-dim{background:var(--bg-alt);color:var(--text-muted);border:1px solid var(--border);}

    /* ── CONTENT AREA ── */
    .content{padding:24px 48px;padding-bottom:calc(80px + env(safe-area-inset-bottom));max-width:900px;}

    /* ── CARDS ── */
    .card{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);
      padding:16px 20px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
    .card-alt{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-alt);
      padding:16px 20px;margin-bottom:10px;}
    .anomaly-card{border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-light);
      padding:16px 20px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
    .anomaly-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);}
    .cash-card{border-radius:var(--radius);border:1px solid var(--amber-border);background:var(--amber-light);
      padding:16px 20px;margin-bottom:10px;}
    .buy-card{border-radius:var(--radius);border:1px solid var(--border);border-left:3px solid var(--amber);
      background:var(--bg-card);padding:16px 20px;margin-bottom:10px;box-shadow:var(--shadow-sm);}

    /* ── SECTION LABEL ── */
    .section-label{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text-muted);
      text-transform:uppercase;letter-spacing:0.12em;margin-bottom:12px;
      display:flex;align-items:center;justify-content:space-between;
      padding-bottom:8px;border-bottom:1px solid var(--border);}

    /* ── TABLE ── */
    .table-wrap{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-sm);}
    .table-row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);}
    .table-row:last-child{border-bottom:none;}

    /* ── DIVIDER ── */
    .divider{height:1px;background:var(--border);margin:14px 0;}

    /* ── EMPTY STATE ── */
    .empty-state{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);
      padding:40px 24px;text-align:center;box-shadow:var(--shadow-sm);}
    .empty-icon{font-size:36px;margin-bottom:12px;}
    .empty-title{font-family:var(--mono);font-size:13px;color:var(--text-muted);margin-bottom:8px;}
    .empty-desc{font-size:12px;color:var(--text-muted);line-height:1.7;}

    /* ── LOADING / ERROR ── */
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:14px;}
    .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--amber);
      border-radius:50%;animation:spin 0.7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── FAB ── */
    .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;
      width:48px;height:48px;border-radius:50%;background:var(--amber);border:none;
      color:#fff;font-size:20px;cursor:pointer;
      box-shadow:0 4px 20px rgba(200,117,51,0.35);
      display:flex;align-items:center;justify-content:center;font-weight:700;z-index:50;
      transition:background 0.15s,transform 0.15s;}
    .fab:hover{background:#B56828;transform:scale(1.05);}
    .fab.spinning{animation:spin 0.7s linear infinite;}

    /* ── BTN ── */
    .btn-primary{padding:9px 20px;border-radius:var(--radius-sm);background:var(--blue);
      border:none;color:white;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;transition:background 0.15s;}
    .btn-primary:hover{background:#2F4880;}

    /* ── HIT BAR ── */
    .hit-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;}
    .hit-bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}

    /* ── WATCHLIST VERDICT ── */
    .verdict-buy{background:var(--green-light);color:var(--green);border:1px solid var(--green-border);}
    .verdict-avoid{background:var(--red-light);color:var(--red);border:1px solid var(--red-border);}
    .verdict-watch{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-border);}

    /* ── FOOTER ── */
    .site-footer{border-top:1px solid var(--border);padding:24px 48px;margin-top:40px;background:var(--bg-card);}
    .site-footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
    .site-footer-copy{font-family:var(--mono);font-size:12px;color:var(--text-muted);}
    .site-footer-links{display:flex;gap:20px;}
    .site-footer-links a{font-size:13px;color:var(--text-muted);text-decoration:none;transition:color 0.15s;}
    .site-footer-links a:hover{color:var(--blue);}

    /* ── RESPONSIVE ── */
    @media(max-width:768px){
      .site-nav{padding:0 20px;}
      .site-nav-links{display:none;}
      .dash-header{padding:10px 20px 0;top:54px;}
      .content{padding:16px 20px;padding-bottom:calc(80px + env(safe-area-inset-bottom));}
      .site-footer{padding:20px;}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}
  </style>
</head>
<body>

<!-- SITE NAV -->
<nav class="site-nav">
  <a class="site-nav-brand" href="/">akshit.ahuja.js.org</a>
  <ul class="site-nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/system-design/">System Design</a></li>
    <li><a href="/market-dashboard/" class="active">Market Dashboard</a></li>
    <li><a href="https://github.com/ahuja101992" target="_blank">GitHub ↗</a></li>
  </ul>
</nav>

<!-- DASHBOARD HEADER (sticky) -->
<div id="dash-header"></div>

<!-- CONTENT -->
<div id="content" class="content"></div>

<!-- FAB -->
<button class="fab" id="fab" onclick="refresh()" title="Refresh">↻</button>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="site-footer-inner">
    <span class="site-footer-copy">akshit.ahuja.js.org · market-dashboard · 2026</span>
    <div class="site-footer-links">
      <a href="/">← Home</a>
      <a href="/system-design/">System Design</a>
      <a href="portfolio.html">Portfolio ↗</a>
    </div>
  </div>
</footer>

<script>
const WORKER_URL = "https://late-firefly-cd42-market-brief.ahuja101992-753.workers.dev";
let DATA = null;
let activeTab = "brief";

function formatFileTime(isoString) {
  if (!isoString) return null;
  try {
    const d = new Date(isoString);
    return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York",hour12:true}) + " ET";
  } catch(e) { return null; }
}

async function fetchData() {
  showLoading();
  try {
    const res = await fetch(WORKER_URL + "?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("Worker returned " + res.status);
    DATA = await res.json();
    if (DATA.error) throw new Error(DATA.error);
    renderAll();
  } catch(e) { showError(e.message); }
}

async function refresh() {
  const fab = document.getElementById("fab");
  fab.classList.add("spinning");
  await fetchData();
  fab.classList.remove("spinning");
}

function showLoading() {
  document.getElementById("dash-header").innerHTML = "";
  document.getElementById("content").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p style="font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:0.12em">LOADING FROM DRIVE...</p>
    </div>`;
}

function showError(msg) {
  document.getElementById("content").innerHTML = `
    <div class="empty-state" style="margin-top:40px">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">Could not load brief</div>
      <p class="empty-desc" style="margin-bottom:20px;max-width:300px;margin-left:auto;margin-right:auto">${msg}</p>
      <button class="btn-primary" onclick="fetchData()">Retry</button>
    </div>`;
}

function renderAll() { renderDashHeader(); renderTab(activeTab); }

function renderDashHeader() {
  if (!DATA) return;
  const vixNum = parseFloat(DATA.vix) || 0;
  const vixColor = vixNum > 20 ? "var(--red)" : vixNum > 15 ? "var(--amber)" : "var(--green)";
  const tone = DATA.tone || "—";
  const toneClass = tone.includes("risk-on") ? "pill-success" : tone.includes("off") ? "pill-danger" : "pill-warn";
  const hasAnomaly = (DATA.anomalies||[]).length > 0;
  const tabs = [
    {id:"brief",    label:"Brief"},
    {id:"overview", label:"Overview"},
    {id:"watchlist",label:"Watchlist"},
    {id:"conviction",label:"Conviction"},
    {id:"macro",    label:"Macro"},
  ];
  document.getElementById("dash-header").innerHTML = `
    <div class="dash-header">
      <div class="dash-header-row">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
            <span class="dash-title">Market Brief</span>
            <span class="pill ${toneClass}">${(tone.split(";")[0]).substring(0,24)}</span>
            ${hasAnomaly ? `<span class="pill pill-danger">🚨 Alert</span>` : ""}
          </div>
          <p class="dash-meta">${DATA.run_date||""} · ${formatFileTime(DATA._file_modified)||DATA.run_time_et||""} · ${DATA.market_state||""}</p>
        </div>
        <div class="vix-block">
          <div class="vix-label">VIX</div>
          <div class="vix-val" style="color:${vixColor}">${DATA.vix||"—"}</div>
        </div>
      </div>
      <div class="tabs">${tabs.map(t=>`<button class="tab${activeTab===t.id?" active":""}" onclick="switchTab('${t.id}')">${t.label}</button>`).join("")}</div>
    </div>`;
}

function switchTab(tab) { activeTab = tab; renderDashHeader(); renderTab(tab); window.scrollTo({top:0}); }

function renderTab(tab) {
  const map = {brief:renderBrief, overview:renderOverview, watchlist:renderWatchlist, conviction:renderConviction, macro:renderMacro};
  (map[tab] || renderBrief)();
}

/* ── BRIEF ─────────────────────────────────────────────────────────────── */
function renderBrief() {
  const anomalies = DATA.anomalies||[];
  const buys = DATA.recommended_buys||[];
  let html = "";

  if (anomalies.length) {
    html += sectionLabel("Anomaly Alerts", `${anomalies.length} today`);
    anomalies.forEach(a => {
      html += `<div class="anomaly-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <span style="font-family:var(--mono);font-weight:700;font-size:17px;color:var(--red)">${a.ticker}</span>
          <span style="font-size:10px;color:var(--text-muted);font-family:var(--mono)">${a.source||""}</span>
        </div>
        <p style="font-size:13.5px;line-height:1.6;margin-bottom:8px;color:var(--text)">${a.headline}</p>
        <span style="font-size:12px;color:var(--amber);font-weight:500;">→ ${a.suggestion}</span>
      </div>`;
    });
  } else {
    html += `<div class="card-alt" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <span style="font-size:16px;">⚡</span>
      <span style="font-size:13px;color:var(--text-muted);font-family:var(--mono)">No anomaly alerts today</span>
    </div>`;
  }

  html += `<div class="divider"></div>`;
  html += sectionLabel("Buy This Period", `$${DATA.total_deployed_usd||0} of $500`);

  buys.forEach((b,i) => {
    if (b.ticker === "CASH") {
      html += `<div class="cash-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span style="font-family:var(--mono);font-weight:700;font-size:15px;color:var(--amber)">💵 CASH</span>
          <span style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--amber)">$${b.amount_usd}</span>
        </div>
        <p style="font-size:13px;line-height:1.6;color:var(--text-mid)">${b.reason||b.why||""}</p>
      </div>`;
      return;
    }
    const cv = typeof b.conviction==="number"?b.conviction:parseInt(b.conviction)||0;
    html += `<div class="buy-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:var(--mono);font-size:11px;color:var(--text-muted)">#${i+1}</span>
          <span style="font-family:var(--mono);font-weight:700;font-size:20px;color:var(--text)">${b.ticker}</span>
          <span style="font-family:var(--mono);font-weight:700;font-size:16px;color:var(--amber)">$${b.amount_usd}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${b.price_at_flag?`<span style="font-family:var(--mono);font-size:11px;color:var(--text-muted)">$${b.price_at_flag}</span>`:""}
          <span class="pill pill-dim">${b.composite||b.conviction||""}</span>
        </div>
      </div>
      ${convBarsHtml(cv)}
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
        <p style="font-size:13px;line-height:1.6;margin:0;color:var(--text-mid)"><span style="color:var(--green);margin-right:6px;font-weight:600;">✓</span>${b.why||""}</p>
        ${b.risk?`<p style="font-size:13px;line-height:1.6;color:var(--text-muted);margin:0"><span style="color:var(--red);margin-right:6px;font-weight:600;">⚠</span>${b.risk}</p>`:""}
      </div>
    </div>`;
  });

  html += `<p style="font-family:var(--mono);text-align:center;font-size:10px;color:var(--text-muted);margin-top:16px;">Not investment advice · ${DATA.run_date||""}</p>`;
  document.getElementById("content").innerHTML = html;
}

/* ── OVERVIEW ───────────────────────────────────────────────────────────── */
function renderOverview() {
  const n = DATA.market_narrative;
  if (!n || (!n.today && !n.this_week && !n.big_picture)) {
    document.getElementById("content").innerHTML = emptyState("📰","No overview yet","The market narrative populates on the next routine run.");
    return;
  }
  let html = sectionLabel("Market Overview", `${DATA.run_date||""}`);
  const blocks = [
    {key:"today",    icon:"🔎", label:"Today",       color:"var(--amber)"},
    {key:"this_week",icon:"📅", label:"This Week",   color:"var(--blue)"},
    {key:"big_picture",icon:"🌍",label:"Big Picture",color:"var(--green)"},
  ];
  blocks.forEach(b => {
    if (!n[b.key]) return;
    html += `<div class="card" style="border-left:3px solid ${b.color};">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="font-size:15px;">${b.icon}</span>
        <span style="font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:${b.color}">${b.label}</span>
      </div>
      <p style="font-size:14px;line-height:1.75;color:var(--text-mid)">${n[b.key]}</p>
    </div>`;
  });
  html += footnote("Written by Claude · Not investment advice");
  document.getElementById("content").innerHTML = html;
}

/* ── WATCHLIST ──────────────────────────────────────────────────────────── */
function renderWatchlist() {
  const stocks = DATA.watchlist_analysis||[];
  if (!stocks.length) {
    document.getElementById("content").innerHTML = emptyState("📋","Watchlist is empty",`Edit <span style="font-family:var(--mono);color:var(--amber)">market-briefs/watchlist.md</span> in Google Drive`);
    return;
  }
  let html = sectionLabel("Watchlist", `${stocks.length} stocks · ${DATA.run_time_et||""}`);
  stocks.forEach(s => {
    const v = s.verdict||"WATCH";
    const vClass = v==="BUY"?"verdict-buy":v==="AVOID"?"verdict-avoid":"verdict-watch";
    const borderColor = v==="BUY"?"var(--green-border)":v==="AVOID"?"var(--red-border)":"var(--amber-border)";
    const cp = s.change_pct;
    const hColor = {"this week":"var(--amber)","2-4 weeks":"var(--blue)","longer term":"var(--green)"}[s.time_horizon]||"var(--text-muted)";
    html += `<div class="card" style="border-left:3px solid ${borderColor};">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
            <span style="font-family:var(--mono);font-weight:700;font-size:18px;color:var(--text)">${s.ticker}</span>
            <span class="pill ${vClass}" style="font-size:10px;font-weight:700;">${v}</span>
          </div>
          <p style="font-size:11px;color:var(--text-muted)">${s.name||"—"}</p>
        </div>
        <div style="text-align:right;">
          ${s.current_price?`<div style="font-family:var(--mono);font-size:17px;font-weight:700;color:var(--text)">$${s.current_price}</div>`:""}
          ${cp!=null?`<div style="font-family:var(--mono);font-size:12px;color:${cp>=0?"var(--green)":"var(--red)"};">${cp>=0?"▲":"▼"} ${Math.abs(cp).toFixed(1)}%</div>`:""}
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:5px;">
        <p style="font-size:13px;line-height:1.6;margin:0;color:var(--text-mid)"><span style="color:var(--green);margin-right:5px;font-weight:600;">✓</span>${s.price_context||"—"}</p>
        <p style="font-size:13px;line-height:1.6;color:var(--text-muted);margin:0"><span style="color:var(--amber);margin-right:5px;font-weight:600;">→</span>${s.catalyst||"—"}</p>
        <p style="font-size:13px;line-height:1.6;color:var(--text-muted);margin:0"><span style="color:var(--red);margin-right:5px;font-weight:600;">⚠</span>${s.risk||"—"}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
          <span class="pill pill-dim">${s.confidence||"—"}</span>
          <span style="font-size:10px;padding:2px 8px;border-radius:4px;font-family:var(--mono);color:${hColor};border:1px solid ${hColor}30;">${s.time_horizon||"—"}</span>
        </div>
      </div>
    </div>`;
  });
  html += footnote("Not investment advice · Analysis by Claude");
  document.getElementById("content").innerHTML = html;
}

/* ── CONVICTION ─────────────────────────────────────────────────────────── */
function renderConviction() {
  const list = DATA.conviction_list_summary||[];
  if (!list.length) {
    document.getElementById("content").innerHTML = emptyState("🎯","No conviction list","Add conviction picks to conviction.md in Google Drive.");
    return;
  }
  let html = sectionLabel("Conviction List", `${list.length} names`);
  html += `<div class="table-wrap">`;
  list.forEach((c,i) => {
    const sc = c.status&&c.status.includes("Active")&&!c.status.includes("Watch")?"pill-success":
               c.status&&(c.status.includes("Contrarian")||c.status.includes("Low"))?"pill-danger":
               c.status&&c.status.includes("Candidate")?"pill-info":"pill-warn";
    const cv = typeof c.conviction==="number"?c.conviction:parseInt(c.conviction)||0;
    html += `<div class="table-row" style="align-items:flex-start;padding:14px 16px;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
          <span style="font-family:var(--mono);font-weight:700;font-size:14px;color:var(--text)">${c.ticker}</span>
          <span class="pill ${sc}">${c.status||""}</span>
        </div>
        ${c.catalyst?`<p style="font-size:12px;color:var(--text-muted);line-height:1.5;">${c.catalyst}</p>`:""}
      </div>
      <div style="text-align:right;flex-shrink:0;">
        ${c.conviction!=null?convBarsHtml(cv):""}
        ${c.runs_flagged!=null?`<div style="font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:4px;">${c.runs_flagged} runs</div>`:""}
      </div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById("content").innerHTML = html;
}

/* ── MACRO ──────────────────────────────────────────────────────────────── */
function renderMacro() {
  const m = DATA.macro||{};
  const etfs = Object.entries(DATA.sector_etfs||{}).filter(([,v])=>v.change_pct!=null);
  let html = sectionLabel("Macro Snapshot");
  if (etfs.length) {
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:14px;">`;
    etfs.forEach(([k,v]) => {
      const pos = v.change_pct >= 0;
      html += `<div class="card-alt" style="text-align:center;padding:10px 8px;margin-bottom:0;">
        <div style="font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-bottom:4px;">${k}</div>
        <div style="font-family:var(--mono);font-weight:700;font-size:15px;color:${pos?"var(--green)":"var(--red)"};">${pos?"+":""}${v.change_pct.toFixed(1)}%</div>
      </div>`;
    });
    html += `</div>`;
  }
  const rows = [
    ["10Y Yield", m.ten_year_yield_pct ? `${m.ten_year_yield_pct}%` : null],
    ["Geopolitical", m.geopolitical],
    ["Next CPI", m.cpi_next],
    ["Next FOMC", m.fomc_next],
  ].filter(([,v])=>v);
  if (rows.length) {
    html += `<div class="table-wrap">`;
    rows.forEach(([k,v]) => {
      html += `<div style="display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border);">
        <span style="font-family:var(--mono);font-size:12px;color:var(--text-muted);min-width:110px;">${k}</span>
        <span style="font-size:13px;color:var(--text);text-align:right;flex:1;">${v}</span>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById("content").innerHTML = html;
}

/* ── HELPERS ────────────────────────────────────────────────────────────── */
function convBarsHtml(v, max=5) {
  let html = `<div style="display:inline-flex;align-items:center;gap:3px;">`;
  for (let i=0;i<max;i++) {
    html += `<div style="width:12px;height:3px;border-radius:2px;background:${i<v?"var(--amber)":"var(--border)"}"></div>`;
  }
  html += `<span style="font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-left:5px;">${v}/${max}</span></div>`;
  return html;
}

function sectionLabel(title, sub="") {
  return `<div class="section-label"><span>${title}</span>${sub?`<span style="font-size:10px;color:var(--text-muted);font-weight:400;">${sub}</span>`:""}</div>`;
}

function emptyState(icon, title, desc="") {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div>${desc?`<p class="empty-desc">${desc}</p>`:""}</div>`;
}

function footnote(text) {
  return `<p style="font-family:var(--mono);text-align:center;font-size:10px;color:var(--text-muted);margin-top:16px;">${text}</p>`;
}

fetchData();
</script>
</body>
</html>
